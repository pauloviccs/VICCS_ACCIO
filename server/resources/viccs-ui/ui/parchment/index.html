<!doctype html>
<html lang="pt-BR" data-house-theme="gryffindor">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACCIO — Correio & Pergaminho</title>
    <link rel="stylesheet" href="fw://resources/viccs-ui/ui/tokens.css" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="parchment-title">
        <article id="parchment-card" class="parchment-shell">
            <div class="wax-seal" aria-hidden="true">ACCIO</div>

            <header class="parchment-header">
                <img id="house-emblem" class="house-emblem hidden" alt="" />
                <p id="parchment-eyebrow" class="eyebrow-ink">Correspondência Oficial de Hogwarts</p>
                <h1 id="parchment-title" class="parchment-title">Carta de Admissão</h1>
                <div id="divider-slot"></div>
            </header>

            <div id="parchment-body" class="parchment-body"></div>

            <footer class="parchment-footer">
                <p id="parchment-signature" class="parchment-signature"></p>
                <div class="parchment-actions">
                    <button type="button" id="btn-close" class="btn-primary">Guardar Pergaminho</button>
                </div>
            </footer>
        </article>
    </div>

    <script src="fw://resources/viccs-ui/ui/ornaments.js"></script>
    <script src="app.js"></script>
</body>
</html>
